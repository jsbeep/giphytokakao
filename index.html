    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;

      }
      #initial-loader h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;

      }
      #initial-loader .accent {
        color: #fae100;
        text-shadow: 1px 1px 6px rgba(21, 16, 8, 0.14);
      }
      #initial-loader .bar-track {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(7, 8, 10, 0.12);
        overflow: hidden;
      }
      #initial-loader .bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #07080a;
        animation: initial-loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes initial-loader-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }
